const DATA=[{"repo": "opentitan", "hash": "e849d530844d8849ffdf5a2e1c0ee227255b5132", "subject": "[fpv] Replace ASSERT_VALID_DATA with ASSERT_KNOWN_IF", "body": "ASSERT_KNOWN_IF checks a signal isn't X only if some enable term is true.\nIt also checks the enable term is never X. This functionality was\npreviously available with ASSERT_VALID_DATA. Differences are justified\nby the following:\n\n- Alters functionality to use implication rather &&, this can provide\n  performance benefits\n- ASSERT_KNOWN_IF naming is more general (ASSERT_VALID_DATA sounds\n  targeted to interfaces with valid and data signals) and is clearly\n  associated with ASSERT_KNOWN\n\nASSERT_VALID_READY_DATA is removed as it wasn't being used.\n\nSigned-off-by: Greg Chadwick <gac@lowrisc.org>", "files": "M hw/ip/flash_ctrl/rtl/flash_ctrl.sv\nM hw/ip/prim/rtl/prim_assert.sv\nM hw/ip/tlul/rtl/tlul_assert.sv", "diff": "diff --git a/hw/ip/flash_ctrl/rtl/flash_ctrl.sv b/hw/ip/flash_ctrl/rtl/flash_ctrl.sv\nindex 17921cb03c..80e83ceef6 100644\n--- a/hw/ip/flash_ctrl/rtl/flash_ctrl.sv\n+++ b/hw/ip/flash_ctrl/rtl/flash_ctrl.sv\n@@ -471,8 +471,8 @@ module flash_ctrl (\n   `ASSERT_KNOWN(TlAReadyKnownO_A,       tl_o.a_ready     )\n   `ASSERT_KNOWN(FlashKnownO_A,          {flash_o.req, flash_o.rd, flash_o.prog, flash_o.pg_erase,\n                                          flash_o.bk_erase})\n-  `ASSERT_VALID_DATA(FlashAddrKnown_A,  flash_o.req, flash_o.addr)\n-  `ASSERT_VALID_DATA(FlashProgKnown_A,  flash_o.prog & flash_o.req, flash_o.prog_data)\n+  `ASSERT_KNOWN_IF(FlashAddrKnown_A,    flash_o.addr, flash_o.req)\n+  `ASSERT_KNOWN_IF(FlashProgKnown_A,    flash_o.prog_data, flash_o.prog & flash_o.req)\n   `ASSERT_KNOWN(IntrProgEmptyKnownO_A,  intr_prog_empty_o)\n   `ASSERT_KNOWN(IntrProgLvlKnownO_A,    intr_prog_lvl_o  )\n   `ASSERT_KNOWN(IntrProgRdFullKnownO_A, intr_rd_full_o   )\ndiff --git a/hw/ip/prim/rtl/prim_assert.sv b/hw/ip/prim/rtl/prim_assert.sv\nindex 66e284d537..7e67adaae4 100644\n--- a/hw/ip/prim/rtl/prim_assert.sv\n+++ b/hw/ip/prim/rtl/prim_assert.sv\n@@ -131,19 +131,19 @@\n   `ASSERT(__name, $rose(__sig) |=> !(__sig), __clk, __rst)                                    \\\n `endif\n \n-// Assert that valid is known after reset and data is known when valid == 1\n-`define ASSERT_VALID_DATA(__name, __valid, __dat, __clk = `ASSERT_DEFAULT_CLK, __rst = `ASSERT_DEFAULT_RST) \\\n-`ifdef INC_ASSERT                                                                                           \\\n-  `ASSERT_KNOWN(__name``KnownValid, __valid, __clk, __rst)                                                  \\\n-  `ASSERT_NEVER(__name``KnownData, (__valid) && $isunknown(__dat), __clk, __rst)                            \\\n-`endif\n-\n-// Same as ASSERT_VALID_DATA, but also assert that ready is known after reset\n-`define ASSERT_VALID_READY_DATA(__name, __valid, __ready, __dat, __clk = `ASSERT_DEFAULT_CLK, __rst = `ASSERT_DEFAULT_RST) \\\n-`ifdef INC_ASSERT                                                                                                          \\\n-  `ASSERT_KNOWN(__name``KnownValid, __valid, __clk, __rst)                                                                 \\\n-  `ASSERT_KNOWN(__name``KnownReady, __ready, __clk, __rst)                                                                 \\\n-  `ASSERT_NEVER(__name``KnownData, (__valid) && $isunknown(__dat), __clk, __rst)                                           \\\n+// Assert that a property is true only when an enable signal is set.  It can be called as a module\n+// (or interface) body item.\n+`define ASSERT_IF(__name, __prop, __enable, __clk = `ASSERT_DEFAULT_CLK, __rst = `ASSERT_DEFAULT_RST) \\\n+`ifdef INC_ASSERT                                                                                     \\\n+  `ASSERT(__name, (__enable) |-> (__prop), __clk, __rst)                                              \\\n+`endif\n+\n+// Assert that signal has a known value (each bit is either '0' or '1') after reset if enable is\n+// set.  It can be called as a module (or interface) body item.\n+`define ASSERT_KNOWN_IF(__name, __sig, __enable, __clk = `ASSERT_DEFAULT_CLK, __rst = `ASSERT_DEFAULT_RST) \\\n+`ifdef INC_ASSERT                                                                                          \\\n+  `ASSERT_KNOWN(__name``KnownEnable, __enable, __clk, __rst)                                               \\\n+  `ASSERT_IF(__name, !$isunknown(__sig), __enable, __clk, __rst)                                           \\\n `endif\n \n ///////////////////////\ndiff --git a/hw/ip/tlul/rtl/tlul_assert.sv b/hw/ip/tlul/rtl/tlul_assert.sv\nindex a27c80ab92..c0498c7098 100644\n--- a/hw/ip/tlul/rtl/tlul_assert.sv\n+++ b/hw/ip/tlul/rtl/tlul_assert.sv\n@@ -272,12 +272,12 @@ module tlul_assert #(\n \n   // a_* should be known when a_valid == 1 (a_opcode and a_param are already covered above)\n   // This also covers ASSERT_KNOWN of a_valid\n-  `ASSERT_VALID_DATA(aKnown_A, h2d.a_valid, {h2d.a_size, h2d.a_source, h2d.a_address,\n-      h2d.a_mask, h2d.a_user})\n+  `ASSERT_KNOWN_IF(aKnown_A, {h2d.a_size, h2d.a_source, h2d.a_address, h2d.a_mask, h2d.a_user},\n+    h2d.a_valid)\n \n   // d_* should be known when d_valid == 1 (d_opcode, d_param, d_size already covered above)\n   // This also covers ASSERT_KNOWN of d_valid\n-  `ASSERT_VALID_DATA(dKnown_A, d2h.d_valid, {d2h.d_source, d2h.d_sink, d2h.d_error, d2h.d_user})\n+  `ASSERT_KNOWN_IF(dKnown_A, {d2h.d_source, d2h.d_sink, d2h.d_error, d2h.d_user}, d2h.d_valid)\n \n   //  make sure ready is not X after reset\n   `ASSERT_KNOWN(aReadyKnown_A, d2h.a_ready)"}, {"repo": "caliptra-rtl", "hash": "894dc19ce1f291d9f764309f1648d0000b17b23c", "subject": "Merged PR 106673: fixing sha accelerator bug", "body": "fixing sha accelerator bug\nWhen padding is required in the last dword of the block, sha accelerator runs the engine twice on the same block\nFixed by identifying when we've written the last dword of the programmed DLEN and waiting for execute or mailbox read done to move forward with padding instead of process the block right away\n\nRelated work items: #466949", "files": "M src/soc_ifc/rtl/sha512_acc_top.sv", "diff": "diff --git a/src/soc_ifc/rtl/sha512_acc_top.sv b/src/soc_ifc/rtl/sha512_acc_top.sv\nindex 3c94d6cd..542bcc22 100644\n--- a/src/soc_ifc/rtl/sha512_acc_top.sv\n+++ b/src/soc_ifc/rtl/sha512_acc_top.sv\n@@ -101,9 +101,9 @@ module sha512_acc_top\n   logic stream_mode_block_we;\n   logic block_we;\n   logic mbox_mode_last_dword_wr;\n-  logic stream_mode_last_dword_wr;\n-  logic last_dword_wr;\n   logic block_full;\n+  logic pad_last_block;\n+  logic [31:0] num_bytes_wr;\n   logic [BLOCK_OFFSET_W:0] block_wptr;\n   logic [DATA_NUM_BYTES-1:0][7:0] mbox_rdata;\n   logic [DATA_WIDTH-1:0] block_wdata;\n@@ -201,18 +201,20 @@ always_comb core_digest_valid_q = core_digest_valid & ~(init_reg | next_reg);\n   //Detect writes to datain register\n   always_comb datain_write = hwif_in.valid_user & hwif_out.DATAIN.DATAIN.swmod;\n   always_comb execute_set = hwif_out.EXECUTE.EXECUTE.value;\n+  //flag to indicate that our last block will need the padding added to it\n+  always_comb pad_last_block = (|hwif_out.DLEN.LENGTH.value[1:0]);\n \n   //When we reach the end of a block we indicate block full\n-  always_comb block_full = block_wptr[BLOCK_OFFSET_W];\n+  //If this is also the end of the entire DLEN, mask block full so that we properly pad the last dword\n+  //We don't want to mask this if num bytes wr is == dlen. This means we wrote a full dword and no padding goes here\n+  always_comb block_full = block_wptr[BLOCK_OFFSET_W] & ~(num_bytes_wr > hwif_out.DLEN.LENGTH.value);\n   always_comb mbox_mode_last_dword_wr = mbox_mode_block_we & (block_wptr == (BLOCK_NO-1));\n-  always_comb stream_mode_last_dword_wr = stream_mode_block_we & (block_wptr == (BLOCK_NO-1));\n-  always_comb last_dword_wr = block_we & (block_wptr == (BLOCK_NO-1));\n \n   //read from mbox is one clock ahead of writes\n   //stall reads based on hold signal from mbox (which is asserted during ECC write-back)\n   //don't read the next dword if we are writing the last dword of a block and core isn't ready\n   //keep stalling the read once the block is full until core is ready - this will reset the block pointer and start the next one\n-  always_comb mbox_read_en = mailbox_mode & ~mbox_read_done & !sha_sram_hold & (~(mbox_mode_last_dword_wr | block_full) | core_ready);\n+  always_comb mbox_read_en = mailbox_mode & ~mbox_read_done & !sha_sram_hold & ~(mbox_mode_last_dword_wr | block_full);\n \n   always_comb sha_sram_req_dv = mbox_read_en;\n   always_comb sha_sram_req_addr = mbox_rdptr[MBOX_ADDR_W-1:0];\n@@ -244,6 +246,7 @@ always_comb core_digest_valid_q = core_digest_valid & ~(init_reg | next_reg);\n       mbox_rdptr    <= '0;\n       mbox_block_we <= '0;\n       block_reg     <= '0;\n+      num_bytes_wr  <= '0;\n     end\n     else begin\n       sha_fsm_ps   <= sha_fsm_ns;\n@@ -260,6 +263,9 @@ always_comb core_digest_valid_q = core_digest_valid & ~(init_reg | next_reg);\n \n       mbox_block_we <= mbox_read_en;\n \n+      num_bytes_wr <= arc_IDLE ? '0 :\n+                      block_we ? num_bytes_wr + 'd4 : num_bytes_wr;\n+\n       for (int dword = 0; dword < BLOCK_NO; dword++) begin\n         block_reg[dword] <= block_we & (block_wptr[BLOCK_OFFSET_W-1:0] == dword) ? block_wdata : block_reg_nxt[dword];\n       end\n@@ -329,8 +335,8 @@ always_comb core_digest_valid_q = core_digest_valid & ~(init_reg | next_reg);\n                                          (streaming_mode & datain_write) |\n                                          (mailbox_mode & execute_set));\n   //When a full block is complete, send INIT and move to BLOCK_N state\n-  always_comb arc_SHA_BLOCK_0_SHA_BLOCK_N = (sha_fsm_ps == SHA_BLOCK_0) & (last_dword_wr | block_full) & core_ready_q;\n-  always_comb arc_SHA_BLOCK_N_SHA_BLOCK_N = (sha_fsm_ps == SHA_BLOCK_N) & (last_dword_wr | block_full) & core_ready_q;\n+  always_comb arc_SHA_BLOCK_0_SHA_BLOCK_N = (sha_fsm_ps == SHA_BLOCK_0) & block_full & core_ready_q;\n+  always_comb arc_SHA_BLOCK_N_SHA_BLOCK_N = (sha_fsm_ps == SHA_BLOCK_N) & block_full & core_ready_q;\n   //When execute is set for streaming, OR we reach the end of the mailbox region, move to PAD0\n   //If a block ends on 1024 bit boundary, we can't move to PAD until that block is processed\n   //so we give priority to the end of block arcs, and move to PAD only after core is ready for the pad block\n(1 non-HDL files also changed in this commit; not shown)"}, {"repo": "caliptra-rtl", "hash": "57fb477248739a9507ed59fab7e2e22eee39104b", "subject": "Merged PR 107356: fixed drbg bound check", "body": "fixed drbg bound check\n\nRelated work items: #468601", "files": "M src/hmac_drbg/rtl/hmac_drbg.sv", "diff": "diff --git a/src/hmac_drbg/rtl/hmac_drbg.sv b/src/hmac_drbg/rtl/hmac_drbg.sv\nindex ba14f96d..51d3bd14 100644\n--- a/src/hmac_drbg/rtl/hmac_drbg.sv\n+++ b/src/hmac_drbg/rtl/hmac_drbg.sv\n@@ -369,7 +369,7 @@ module hmac_drbg\n \n       CHCK_ST:\n       begin\n-        if ((HMAC_tag==0) || (HMAC_tag > HMAC_DRBG_PRIME))\n+        if ((HMAC_tag==0) || (HMAC_tag >= HMAC_DRBG_PRIME))\n           drbg_next_st    = K3_ST;\n         else\n           drbg_next_st    = DONE_ST;"}, {"repo": "opentitan", "hash": "45a08a008b59b022cb044c5fab2f1d904dd9fffd", "subject": "[flash_ctrl] Remove scramble for english_breakfast", "body": "- allow flash scramble to be removed for cw305 to give some\n  fpga breathing space\n- the parameter is a Sec parameter that should be double\n  checked prior to tapeout\n\nSigned-off-by: Timothy Chen <timothytim@google.com>", "files": "M hw/ip/flash_ctrl/data/flash_ctrl.sv.tpl\nM hw/ip/flash_ctrl/rtl/flash_ctrl.sv\nM hw/ip/flash_ctrl/rtl/flash_phy.sv\nM hw/ip/flash_ctrl/rtl/flash_phy_core.sv\nM hw/ip/flash_ctrl/rtl/flash_phy_scramble.sv\nM hw/top_earlgrey/ip/flash_ctrl/rtl/autogen/flash_ctrl.sv\nM hw/top_earlgrey/rtl/autogen/top_earlgrey.sv", "diff": "diff --git a/hw/ip/flash_ctrl/data/flash_ctrl.sv.tpl b/hw/ip/flash_ctrl/data/flash_ctrl.sv.tpl\nindex 5702f02ca9..0a4965cb98 100644\n--- a/hw/ip/flash_ctrl/data/flash_ctrl.sv.tpl\n+++ b/hw/ip/flash_ctrl/data/flash_ctrl.sv.tpl\n@@ -16,7 +16,8 @@ module flash_ctrl\n   parameter flash_key_t           RndCnstAddrKey  = RndCnstAddrKeyDefault,\n   parameter flash_key_t           RndCnstDataKey  = RndCnstDataKeyDefault,\n   parameter lfsr_seed_t           RndCnstLfsrSeed = RndCnstLfsrSeedDefault,\n-  parameter lfsr_perm_t           RndCnstLfsrPerm = RndCnstLfsrPermDefault\n+  parameter lfsr_perm_t           RndCnstLfsrPerm = RndCnstLfsrPermDefault,\n+  parameter bit                   SecScrambleEn   = 1'b1\n ) (\n   input        clk_i,\n   input        rst_ni,\n@@ -1150,7 +1151,9 @@ module flash_ctrl\n     .rerror_i    ({flash_host_rderr,1'b0})\n   );\n \n-  flash_phy u_eflash (\n+  flash_phy #(\n+    .SecScrambleEn(SecScrambleEn)\n+  ) u_eflash (\n     .clk_i,\n     .rst_ni,\n     .host_req_i        (flash_host_req),\ndiff --git a/hw/ip/flash_ctrl/rtl/flash_ctrl.sv b/hw/ip/flash_ctrl/rtl/flash_ctrl.sv\nindex 1c142da52e..ac819ca6b3 100644\n--- a/hw/ip/flash_ctrl/rtl/flash_ctrl.sv\n+++ b/hw/ip/flash_ctrl/rtl/flash_ctrl.sv\n@@ -16,7 +16,8 @@ module flash_ctrl\n   parameter flash_key_t           RndCnstAddrKey  = RndCnstAddrKeyDefault,\n   parameter flash_key_t           RndCnstDataKey  = RndCnstDataKeyDefault,\n   parameter lfsr_seed_t           RndCnstLfsrSeed = RndCnstLfsrSeedDefault,\n-  parameter lfsr_perm_t           RndCnstLfsrPerm = RndCnstLfsrPermDefault\n+  parameter lfsr_perm_t           RndCnstLfsrPerm = RndCnstLfsrPermDefault,\n+  parameter bit                   SecScrambleEn   = 1'b1\n ) (\n   input        clk_i,\n   input        rst_ni,\n@@ -1151,7 +1152,9 @@ module flash_ctrl\n     .rerror_i    ({flash_host_rderr,1'b0})\n   );\n \n-  flash_phy u_eflash (\n+  flash_phy #(\n+    .SecScrambleEn(SecScrambleEn)\n+  ) u_eflash (\n     .clk_i,\n     .rst_ni,\n     .host_req_i        (flash_ -off-by: Rupert Swarbrick <rswarbrick@lowrisc.org>", "files": "M hw/ip/otbn/dv/uvm/env/seq_lib/otbn_single_vseq.sv\nA hw/ip/otbn/dv/uvm/env/seq_lib/otbn_smoke_vseq.sv\nM hw/ip/otbn/dv/uvm/env/seq_lib/otbn_vseq_list.sv", "diff": "diff --git a/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_single_vseq.sv b/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_single_vseq.sv\nindex 0763357f1b..d844072a85 100644\n--- a/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_single_vseq.sv\n+++ b/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_single_vseq.sv\n@@ -18,11 +18,22 @@ class otbn_single_vseq extends otbn_base_vseq;\n   }\n \n   task body();\n+    string elf_path = pick_elf_path();\n+\n+    // Actually load the binary\n+    `uvm_info(`gfn, $sformatf(\"|-- Loading binary from `%0s'\", elf_path), UVM_MEDIUM)\n+    load_elf(elf_path, do_backdoor_load);\n+\n+    // We've loaded the binary. Run the processor to see what happens!\n+    run_otbn();\n+  endtask : body\n+\n+  virtual protected function string pick_elf_path();\n     chandle helper;\n     int     num_files;\n     string  elf_path;\n \n-    // Sanity check to make sure that cfg.otbn_elf_dir was set by the test\n+    // Check that cfg.otbn_elf_dir was set by the test\n     `DV_CHECK_FATAL(cfg.otbn_elf_dir.len() > 0);\n \n     // Pick an ELF file to use in the test. We have to do this via DPI (because you can't list a\n@@ -43,16 +54,14 @@ class otbn_single_vseq extends otbn_base_vseq;\n     elf_path = OtbnTestHelperGetFilePath(helper, $urandom_range(num_files - 1));\n     `DV_CHECK_FATAL(elf_path.len() > 0, \"Bad index for ELF file\")\n \n-    // Actually load the binary\n-    `uvm_info(`gfn, $sformatf(\"|-- Loading binary from `%0s'\", elf_path), UVM_MEDIUM)\n-    load_elf(elf_path, do_backdoor_load);\n+    // Use sformat in a trivial way to take a copy of the string, so we can safely free helper (and\n+    // hence the old elf_path) afterwards.\n+    elf_path = $sformatf(\"%0s\", elf_path);\n \n-    // At this point, we won't use elf_path again, so we can safely free the test helper which was\n-    // maintaining its memory.\n+    // Now that we've taken a copy of elf_path, we can safely free the test helper.\n     OtbnTestHelperFree(helper);\n \n-    // We've loaded the binary. Run the processor to see what happens!\n-    run_otbn();\n-  endtask : body\n+    return elf_path;\n+  endfunction\n \n endclass : otbn_single_vseq\ndiff --git a/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_smoke_vseq.sv b/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_smoke_vseq.sv\nnew file mode 100644\nindex 0000000000..cbade718b5\n--- /dev/null\n+++ b/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_smoke_vseq.sv\n@@ -0,0 +1,22 @@\n+// Copyright lowRISC contributors.\n+// Licensed under the Apache License, Version 2.0, see LICENSE for details.\n+// SPDX-License-Identifier: Apache-2.0\n+\n+// A smoke test sequence. This loads up the fixed \"smoke.elf\" binary and forces everything to be in\n+// \"simple\" mode.\n+\n+class otbn_smoke_vseq extends otbn_single_vseq;\n+  `uvm_object_utils(otbn_smoke_vseq)\n+  `uvm_object_new\n+\n+  constraint do_backdoor_load_c { do_backdoor_load == 1'b0; }\n+\n+  // Override pick_elf_path to always choose \"smoke.elf\"\n+  protected function string pick_elf_path();\n+    // Check that cfg.otbn_elf_dir was set by the test\n+    `DV_CHECK_FATAL(cfg.otbn_elf_dir.len() > 0);\n+\n+    return $sformatf(\"%0s/smoke.elf\", cfg.otbn_elf_dir);\n+  endfunction\n+\n+endclass\ndiff --git a/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_vseq_list.sv b/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_vseq_list.sv\nindex bb7aa9912d..a76c7fd28f 100644\n--- a/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_vseq_list.sv\n+++ b/hw/ip/otbn/dv/uvm/env/seq_lib/otbn_vseq_list.sv\n@@ -5,3 +5,4 @@\n `include \"otbn_base_vseq.sv\"\n `include \"otbn_common_vseq.sv\"\n `include \"otbn_single_vseq.sv\"\n+`include \"otbn_smoke_vseq.sv\"\n(3 non-HDL files also changed in this commit; not shown)"}, {"repo": "caliptra-rtl", "hash": "053d8eb66409a5806643f98dadace4628827bf8a", "subject": "[TB] Fix addr width (#785)", "body": "* MLDS edge clk_i or negedge rst_ni) begin\n-    if (!rst_ni) begin\n-      addrmiss <= 1'b0;\n-    end else if (reg_re || reg_we) begin\n-      addrmiss <= ~|addr_hit;\n-    end\n-  end\n+  assign addrmiss = (reg_re || reg_we) ? ~|addr_hit : 1'b0 ;\n \n   // Check sub-word write is permitted\n   always_comb begin"}, {"repo": "opentitan", "hash": "a0ea68ee7bf16b9a8d611ccbea589078e8bc7a6b", "subject": "[racl] Implement RACL checks in reggen", "body": "Signed-off-by: Robert Schilling <rschilling@rivosinc.com>", "files": "M util/reggen/reg_top.sv.tpl", "diff": "diff --git a/util/reggen/reg_top.sv.tpl b/util/reggen/reg_top.sv.tpl\nindex 06b281eb63..38a2f26636 100644\n--- a/util/reggen/reg_top.sv.tpl\n+++ b/util/reggen/reg_top.sv.tpl\n@@ -33,6 +33,8 @@\n   reg2hw_t = gen_rtl.get_iface_tx_type(block, if_name, False)\n   hw2reg_t = gen_rtl.get_iface_tx_type(block, if_name, True)\n \n+  racl_support = block.bus_interfaces.racl_support[if_name]\n+\n   win_array_decl = f'  [{num_wins}]' if num_wins > 1 else ''\n \n   # Calculate whether we're going to need an AW parameter. We use it if there\n@@ -115,7 +117,13 @@\n %>\n `include \"prim_assert.sv\"\n \n-module ${mod_name} (\n+module ${mod_name}${' (' if not racl_support else ''}\n+% if racl_support:\n+  # (\n+    parameter bit EnableRacl   = 1'b0,\n+    parameter bit RaclErrorRsp = 1'b1\n+  ) (\n+% endif\n   input clk_i,\n   input rst_ni,\n % if rb.has_internal_shadowed_reg():\n@@ -147,6 +155,14 @@ module ${mod_name} (\n   output logic shadowed_update_err_o,\n \n %endif\n+% if racl_support:\n+  // RACL interface\n+  input  top_racl_pkg::racl_policy_vec_t racl_policies_i,\n+  input  integer racl_policy_sel_vec_i[${len(rb.flat_regs)}],\n+  output logic racl_error_o,\n+  output top_racl_pkg::racl_error_log_t racl_error_log_o,\n+\n+% endif\n   // Integrity check errors\n   output logic intg_err_o\n );\n@@ -387,7 +403,12 @@ module ${mod_name} (\n     .be_o    (reg_be),\n     .busy_i  (reg_busy),\n     .rdata_i (reg_rdata),\n+  % if racl_support:\n+    // Translate RACL error to TLUL error if enabled\n+    .error_i (reg_error | (RaclErrorRsp & racl_error_o))\n+  % else:\n     .error_i (reg_error)\n+  % endif\n   );\n \n   // cdc oversampling signals\n@@ -641,14 +662,69 @@ ${finst_gen(sr, field, finst_name, fsig_name, fidx)}\n   % endfor\n \n   logic [${len(regs_flat)-1}:0] addr_hit;\n+% if racl_support:\n+  top_racl_pkg::racl_role_vec_t racl_role_vec;\n+  top_racl_pkg::racl_role_t racl_role;\n+\n+  logic [${len(regs_flat)-1}:0] racl_addr_hit_read;\n+  logic [${len(regs_flat)-1}:0] racl_addr_hit_write;\n+\n+  if (EnableRacl) begin : gen_racl_role_logic\n+    // Retrieve RACL role from user bits and one-hot encode that for the comparison bitmap\n+    assign racl_role = top_racl_pkg::tlul_extract_racl_role_bits(tl_i.a_user.rsvd);\n+\n+    prim_onehot_enc #(\n+      .OneHotWidth( $bits(prim_onehot_enc) )\n+    ) u_racl_role_encode (\n+      .in_i ( racl_role     ),\n+      .en_i ( 1'b1          ),\n+      .out_o( racl_role_vec )\n+    );\n+  end else begin : gen_no_racl_role_logic\n+    assign racl_role     = '0;\n+    assign racl_role_vec = '0;\n+  end\n+\n+% endif\n   always_comb begin\n     addr_hit = '0;\n+  % if racl_support:\n+    racl_addr_hit_read  = '0;\n+    racl_addr_hit_write = '0;\n+  % endif\n     % for i,r in enumerate(regs_flat):\n-    addr_hit[${\"{}\".format(i).rjust(max_regs_char)}] = (reg_addr == ${ublock}_${r.name.upper()}_OFFSET);\n+<% slice = '{}'.format(i).rjust(max_regs_char) %>\\\n+    addr_hit[${slice}] = (reg_addr == ${ublock}_${r.name.upper()}_OFFSET);\n     % endfor\n+  % if racl_support:\n+\n+    if (EnableRacl) begin : gen_racl_hit\n+    % for i,r in enumerate(regs_flat):\n+<% slice = '{}'.format(i).rjust(max_regs_char) %>\\\n+      racl_addr_hit_read [${slice}] = addr_hit[${slice}] & (|(racl_policies_i[racl_policy_sel_vec_i[${slice}]].read_perm  & racl_role_vec));\n+      racl_addr_hit_write[${slice}] = addr_hit[${slice}] & (|(racl_policies_i[racl_policy_sel_vec_i[${slice f8e6548988bc5606c8b26bb9e20adc05", "subject": "[topgen] Improve matching of prefix when renaming parameters", "body": "Topgen moves parameter prefixes like `Sec`, `RndCnst` and `MemSize` to\nthe beginning when generating the top-level parameter names. This messed\nup the parameter `SecureIbex` which became `SecRvCoreIbexureIbex` in the\ntop level. With this commit, prefixes are only moved if they are\nfollowed by an upper case letter. The parameter in the top level thus\nbecomes `RvCoreIbexSecureIbex`.\n\nSigned-off-by: Pirmin Vogel <vogelpi@lowrisc.org>", "files": "M hw/top_earlgrey/rtl/autogen/chip_earlgrey_cw310.sv\nM hw/top_earlgrey/rtl/autogen/chip_earlgrey_nexysvideo.sv\nM hw/top_earlgrey/rtl/autogen/top_earlgrey.sv\nM util/topgen/templates/chiplevel.sv.tpl", "diff": "diff --git a/hw/top_earlgrey/rtl/autogen/chip_earlgrey_cw310.sv b/hw/top_earlgrey/rtl/autogen/chip_earlgrey_cw310.sv\nindex 974b01f2fd..6fb96dccde 100644\n--- a/hw/top_earlgrey/rtl/autogen/chip_earlgrey_cw310.sv\n+++ b/hw/top_earlgrey/rtl/autogen/chip_earlgrey_cw310.sv\n@@ -758,7 +758,7 @@ module chip_earlgrey_cw310 #(\n     .RomCtrlBootRomInitFile(BootRomInitFile),\n     .RvCoreIbexRegFile(ibex_pkg::RegFileFPGA),\n     .RvCoreIbexPipeLine(1),\n-    .SecRvCoreIbexureIbex(0),\n+    .RvCoreIbexSecureIbex(0),\n     .SramCtrlRetAonInstrExec(0),\n     .SramCtrlMainInstrExec(1),\n     .PinmuxAonTargetCfg(PinmuxTargetCfg)\ndiff --git a/hw/top_earlgrey/rtl/autogen/chip_earlgrey_nexysvideo.sv b/hw/top_earlgrey/rtl/autogen/chip_earlgrey_nexysvideo.sv\nindex 1950931205..c5e834cb96 100644\n--- a/hw/top_earlgrey/rtl/autogen/chip_earlgrey_nexysvideo.sv\n+++ b/hw/top_earlgrey/rtl/autogen/chip_earlgrey_nexysvideo.sv\n@@ -742,7 +742,7 @@ module chip_earlgrey_nexysvideo #(\n     .RomCtrlBootRomInitFile(BootRomInitFile),\n     .RvCoreIbexRegFile(ibex_pkg::RegFileFPGA),\n     .RvCoreIbexPipeLine(1),\n-    .SecRvCoreIbexureIbex(0),\n+    .RvCoreIbexSecureIbex(0),\n     .SramCtrlRetAonInstrExec(0),\n     .SramCtrlMain  of DUT SPI Host 0 output and connected to X in the\ncase of DUT SPI Device 0 input.\n\nSigned-off-by: Adrian Lees <a.lees@lowrisc.or", "files": "M hw/ip/prim_generic/rtl/prim_otp_cfg_pkg.sv\nM hw/top_darjeeling/rtl/autogen/chip_darjeeling_asic.sv\nM hw/top_darjeeling/rtl/autogen/chip_darjeeling_cw310.sv\nM hw/top_darjeeling/templates/chiplevel.sv.tpl", "diff": "diff --git a/hw/ip/prim_generic/rtl/prim_otp_cfg_pkg.sv b/hw/ip/prim_generic/rtl/prim_otp_cfg_pkg.sv\nindex 18617e23ec..c961292353 100644\n--- a/hw/ip/prim_generic/rtl/prim_otp_cfg_pkg.sv\n+++ b/hw/ip/prim_generic/rtl/prim_otp_cfg_pkg.sv\n@@ -13,6 +13,6 @@ package prim_otp_cfg_pkg;\n     logic done;\n   } otp_cfg_rsp_t;\n \n-  parameter otp_cfg_rsp_t OTP_CFG_DEFAULT = '0;\n+  parameter otp_cfg_t OTP_CFG_DEFAULT = '0;\n \n endpackage // prim_otp_cfg_pkg\ndiff --git a/hw/top_darjeeling/rtl/autogen/chip_darjeeling_asic.sv b/hw/top_darjeeling/rtl/autogen/chip_darjeeling_asic.sv\nindex 49bd0114c6..a426dc89a5 100644\n--- a/hw/top_darjeeling/rtl/autogen/chip_darjeeling_asic.sv\n+++ b/hw/top_darjeeling/rtl/autogen/chip_darjeeling_asic.sv\n@@ -1154,6 +1154,10 @@ module chip_darjeeling_asic #(\n   otp_ctrl_pkg::otp_ast_req_t otp_ctrl_otp_ast_pwr_seq;\n   otp_ctrl_pkg::otp_ast_rsp_t otp_ctrl_otp_ast_pwr_seq_h;\n \n+  // OTP DFT configuration\n+  prim_otp_cfg_pkg::otp_cfg_t otp_cfg;\n+  assign otp_cfg = prim_otp_cfg_pkg::OTP_CFG_DEFAULT;\n+\n   // entropy source interface\n   // The entropy source pacakge definition should eventually be moved to es\n   entropy_src_pkg::entropy_src_hw_if_req_t entropy_src_hw_if_req;\ndiff --git a/hw/top_darjeeling/rtl/autogen/chip_darjeeling_cw310.sv b/hw/top_darjeeling/rtl/autogen/chip_darjeeling_cw310.sv\nindex 234eb914b7..8a72d4cc28 100644\n--- a/hw/top_darjeeling/rtl/autogen/chip_darjeeling_cw310.sv\n+++ b/hw/top_darjeeling/rtl/autogen/chip_darjeeling_cw310.sv\n@@ -994,6 +994,10 @@ module chip_darjeeling_cw310 #(\n   otp_ctrl_pkg::otp_ast_req_t otp_ctrl_otp_ast_pwr_seq;\n   otp_ctrl_pkg::otp_ast_rsp_t otp_ctrl_otp_ast_pwr_seq_h;\n \n+  // OTP DFT configuration\n+  prim_otp_cfg_pkg::otp_cfg_t otp_cfg;\n+  assign otp_cfg = prim_otp_cfg_pkg::OTP_CFG_DEFAULT;\n+\n   // entropy source interface\n   // The entropy source pacakge definition should eventually be moved to es\n   entropy_src_pkg::entropy_src_hw_if_req_t entropy_src_hw_if_req;\ndiff --git a/hw/top_darjeeling/templates/chiplevel.sv.tpl b/hw/top_darjeeling/templates/chiplevel.sv.tpl\nindex a6d692b30f..8cf9cdef62 100644\n--- a/hw/top_darjeeling/templates/chiplevel.sv.tpl\n+++ b/hw/top_darjeeling/templates/chiplevel.sv.tpl\n@@ -471,6 +471,10 @@ module chip_${top[\"name\"]}_${target[\"name\"]} #(\n   otp_ctrl_pkg::otp_ast_req_t otp_ctrl_otp_ast_pwr_seq;\n   otp_ctrl_pkg::otp_ast_rsp_t otp_ctrl_otp_ast_pwr_seq_h;\n \n+  // OTP DFT configuration\n+  prim_otp_cfg_pkg::otp_cfg_t otp_cfg;\n+  assign otp_cfg = prim_otp_cfg_pkg::OTP_CFG_DEFAULT;\n+\n   // entropy source interface\n   // The entropy source pacakge definition should eventually be moved to es\n   entropy_src_pkg::entropy_src_hw_if_req_t entropy_src_hw_if_req;"}, {"repo": "opentitan", "hash": "0fce3219170e585565e0fdd77dbcecb90d7972e7", "subject": "[pwm,dv] Simplify how we override reg_param in pwm_perf_vseq", "body": "Rather than overriding a constraint with a slightly modified version\nof itself, just give an explicit distribution to the thing we care\nabout.\n\nSigned-off-by: Rupert Swarbrick <rswarbrick@lowrisc.org>", "files": "M hw/ip/pwm/dv/env/seq_lib/pwm_perf_vseq.sv", "diff": "diff --git a/hw/ip/pwm/dv/env/seq_lib/pwm_perf_vseq.sv b/hw/ip/pwm/dv/env/seq_lib/pwm_perf_vseq.sv\nindex ad0bfb56cc..d04dc648d5 100644\n--- a/hw/ip/pwm/dv/env/seq_lib/pwm_perf_vseq.sv\n+++ b/hw/ip/pwm/dv/env/seq_lib/pwm_perf_vseq.sv\n@@ -23,9 +23,8 @@ class pwm_perf_vseq extends pwm_rand_output_vseq;\n   // pwm_rand_output_vseq that uses low power mode less often)\n   extern constraint low_power_c;\n \n-  // Pick minimum or maximum phase delay and ensure heartbeat implies blink (overriding the\n-  // constraint with the same name in pwm_rand_output_vseq that is more general about phase delay).\n-  extern constraint rand_reg_param_c;\n+  // Constrain phase delay to be minimal or maximal\n+  extern constraint phase_delay_c;\n \n   // The duty cycle and the threshold for the heartbeat blink counter should be minimal or maximal,\n   // correspoding to both counters being minimal or both counters being maximal.\n@@ -48,9 +47,7 @@ constraint pwm_perf_vseq::low_power_c {\n   low_power dist {1'b1 :/ 1, 1'b0 :/ 1};\n }\n \n-constraint pwm_perf_vseq::rand_reg_param_c {\n-  rand_reg_param.HtbtEn == 1'b1 -> rand_reg_param.BlinkEn == 1'b1;\n-  rand_reg_param.RsvParam == 0;\n+constraint pwm_perf_vseq::phase_delay_c {\n   rand_reg_param.PhaseDelay dist {MAX_16 :/ 1, 0 :/ 1};\n }\n "}, {"repo": "caliptra-rtl", "hash": "e7bdee492b51b0d05d1ace1d3203ddd14d97bb39", "subject": "[DOCS] SHA3 documentation added (#957)", "body": "* [DOC] SHA3 system level added\n\n* [RTL] Whitespace changes to config_defines.svh\n\n* [DOCS] SHA3 block-level documentation\n\nCo-authored by: Hakim Filali <hfilali@lowrisc.org>\n\n---------\n\nCo-authored-by: Mojtaba Bisheh-Niasar <102058313+mojtaba-bisheh@users.noreply.github.com>", "files": "M src/integration/rtl/config_defines.svh", "diff": "diff --git a/src/integration/rtl/config_defines.svh b/src/integration/rtl/config_defines.svh\nindex 1111f25c..94ad310c 100755\n--- a/src/integration/rtl/config_defines.svh\n+++ b/src/integration/rtl/config_defines.svh\n@@ -84,8 +84,8 @@\n   `define VEER_INTR_VEC_SOC_IFC_NOTIF 20\n   `define VEER_INTR_VEC_SHA_ERROR     21\n   `define VEER_INTR_VEC_SHA_NOTIF     22\n-  `define VEER_INTR_VEC_ABR_ERROR   23\n-  `define VEER_INTR_VEC_ABR_NOTIF   24\n+  `define VEER_INTR_VEC_ABR_ERROR     23\n+  `define VEER_INTR_VEC_ABR_NOTIF     24\n   `define VEER_INTR_VEC_AXI_DMA_ERROR 25\n   `define VEER_INTR_VEC_AXI_DMA_NOTIF 26\n   // Used to tie-off unused upper intr bits\n@@ -106,6 +1 in\n+always @( * ) begin\n   if ( init_start ) begin\n     vcmain_pok_o <= 1'b0;\n   end else if ( !init_start && gen_supp_a ) begin\ndiff --git a/hw/top_earlgrey/ip/ast/rtl/vio_pgd.sv b/hw/top_earlgrey/ip/ast/rtl/vio_pgd.sv\nindex ac75288ab5..4caac0e8f2 100644\n--- a/hw/top_earlgrey/ip/ast/rtl/vio_pgd.sv\n+++ b/hw/top_earlgrey/ip/ast/rtl/vio_pgd.sv\n@@ -31,7 +31,7 @@ initial begin\n   init_start = 1'b0;\n end\n \n-always_comb (* xprop_off *) begin\n+always (* xprop_off *) @( * ) begin\n   if ( init_start ) begin\n     vio_pok_o <= 1'b0;\n   end"}, {"repo": "opentitan", "hash": "68e557f5c31f8e876a366be140384e7e7a2413c0", "subject": "[tlul] update wording from sanity to smoke", "body": "Signed-off-by: Cindy Chen <chencindy@google.com>", "files": "R hw/ip/tlul/generic_dv/env/seq_lib/xbar_smoke_vseq.sv\nM hw/ip/tlul/generic_dv/env/seq_lib/xbar_stress_all_vseq.sv\nM hw/ip/tlul/generic_dv/env/seq_lib/xbar_vseq_list.sv\nM util/tlgen/xbar.dv.sv.tpl", "diff": "diff --git a/hw/ip/tlul/generic_dv/env/seq_lib/xbar_sanity_vseq.sv b/hw/ip/tlul/generic_dv/env/seq_lib/xbar_smoke_vseq.sv\nsimilarity index 83%\nrename from hw/ip/tlul/generic_dv/env/seq_lib/xbar_sanity_vseq.sv\nrename to hw/ip/tlul/generic_dv/env/seq_lib/xbar_smoke_vseq.sv\nindex 2a8b4fc9f8..fe4acab5cf 100644\n--- a/hw/ip/tlul/generic_dv/env/seq_lib/xbar_sanity_vseq.sv\n+++ b/hw/ip/tlul/generic_dv/env/seq_lib/xbar_smoke_vseq.sv\n@@ -4,9 +4,9 @@\n \n // Sequentially test each host to access any device\n // device will respond in order\n-class xbar_sanity_vseq extends xbar_base_vseq;\n+class xbar_smoke_vseq extends xbar_base_vseq;\n \n-  `uvm_object_utils(xbar_sanity_vseq)\n+  `uvm_object_utils(xbar_smoke_vseq)\n   `uvm_object_new\n \n   virtual task body();\ndiff --git a/hw/ip/tlul/generic_dv/env/seq_lib/xbar_stress_all_vseq.sv b/hw/ip/tlul/generic_dv/env/seq_lib/xbar_stress_all_vseq.sv\nindex b51af9fb7a..b3d494df44 100644\n--- a/hw/ip/tlul/generic_dv/env/seq_lib/xbar_stress_all_vseq.sv\n+++ b/hw/ip/tlul/generic_dv/env/seq_lib/xbar_stress_all_vseq.sv\n@@ -14,7 +14,7 @@ class xbar_stress_all_vseq extends xbar_base_vseq;\n   `uvm_object_new\n \n   task body();\n-    string seq_names[] = {\"xbar_sanity_vseq\",\n+    string seq_names[] = {\"xbar_smoke_vseq\",\n                           \"xbar_random_vseq\",\n                           \"xbar_access_same_device_vseq\",\n                           \"xbar_same_source_vseq\",\ndiff --git a/hw/ip/tlul/generic_dv/env/seq_lib/xbar_vseq_list.sv b/hw/ip/tlul/generic_dv/env/seq_lib/xbar_vseq_list.sv\nindex 83abdd3862..0b293b85eb 100644\n--- a/hw/ip/tlul/generic_dv/env/seq_lib/xbar_vseq_list.sv\n+++ b/hw/ip/tlul/generic_dv/env/seq_lib/xbar_vseq_list.sv\n@@ -5,7 +5,7 @@\n `include \"xbar_seq_err_item.sv\"\n `include \"xbar_tl_host_seq.sv\"\n `include \"xbar_base_vseq.sv\"\n-`include \"xbar_sanity_vseq.sv\"\n+`include \"xbar_smoke_vseq.sv\"\n `include \"xbar_random_vseq.sv\"\n `include \"xbar_access_same_device_vseq.sv\"\n `include \"xbar_same_source_vseq.sv\"\ndiff --git a/util/tlgen/xbar.dv.sv.tpl b/util/tlgen/xbar.dv.sv.tpl\nindex 4155512cc5..a9e25cf03f 100644\n--- a/util/tlgen/xbar.dv.sv.tpl\n+++ b/util/tlgen/xbar.dv.sv.tpl\n@@ -2,7 +2,7 @@\n // Licensed under the Apache License, Version 2.0, see LICENSE for details.\n // SPDX-License-Identifier: Apache-2.0\n //\n-// xbar_${xbar.name}_tb module generated by `tlgen.py` tool for sanity check\n+// xbar_${xbar.name}_tb module generated by `tlgen.py` tool for smoke check\n <%\n   import random\n %>\n(5 non-HDL files also changed in this commit; not shown)"}, {"repo": "caliptra-rtl", "hash": "6ce648b259e815eeaa24bc07caf80ebc2f5e93e7", "subject": "[RTL] Key Vault security hardening and AES key masking (#1388)", "body": "* fix bug in kv where fw update reset would unlock entries with no protection\n\tadd fw update reset window qualifier to block accesses and assert errors\n\tabort kv accesses when errors are encountered to prevent partial access\n\n* make key vault errors when using doe terminate t top_earlgrey.sv\n(3 non-HDL files also changed in this commit; not shown)"}, {"repo": "opentitan", "hash": "39faf3879f251b6d77a2f5b241d2cf054718df58", "subject": "[tlul_adapter_sram] Fix to avoid X on invalid read data", "body": "Signed-off-by: Michael Schaffner <msf@opentitan.org>", "files": "M hw/ip/tlul/rtl/tlul_adapter_sram.sv", "diff": "diff --git a/hw/ip/tlul/rtl/tlul_adapter_sram.sv b/hw/ip/tlul/rtl/tlul_adapter_sram.sv\nindex bdc6e5a3f1..700f7c9b84 100644\n--- a/hw/ip/tlul/rtl/tlul_adapter_sram.sv\n+++ b/hw/ip/tlul/rtl/tlul_adapter_sram.sv\n@@ -53,6 +53,7 @@ module tlul_adapter_sram #(\n   typedef struct packed {\n     req_op_e                    op ;\n     logic                       error ;\n+    logic [top_pkg::TL_DW-1:0]  mask ;\n     logic [top_pkg::TL_SZW-1:0] size ;\n     logic [top_pkg::TL_AIW-1:0] source ;\n   } req_t ;\n@@ -151,15 +152,17 @@ module tlul_adapter_sram #(\n   `ASSERT_INIT(TlUlEqualsToSramDw, top_pkg::TL_DW == SramDw)\n \n   // Convert byte mask to SRAM bit mask.\n+  logic [top_pkg::TL_DW-1:0] rmask;\n   always_comb begin\n     for (int i = 0 ; i < top_pkg::TL_DW/8 ; i++) begin\n       wmask_o[8*i+:8] = (tl_i.a_valid) ? {8{tl_i.a_mask[i]}} : '0;\n       // only forward valid data here.\n       wdata_o[8*i+:8] = (tl_i.a_mask[i] && we_o) ? tl_i.a_data[8*i+:8] : '0;\n+      // mask for read data\n+      rmask[8*i+:8] = {8{reqfifo_rdata.mask[i]}};\n     end\n   end\n \n-\n   // Begin: Request Error Detection\n \n   // wr_attr_error: Check if the request size,mask are permitted.\n@@ -194,6 +197,7 @@ module tlul_adapter_sram #(\n   assign reqfifo_wvalid = a_ack ; // Push to FIFO only when granted\n   assign reqfifo_wdata  = '{\n     op:     (tl_i.a_opcode != Get) ? OpWrite : OpRead, // To return AccessAck for opcode error\n+    mask:   tl_i.a_mask,\n     error:  error_internal,\n     size:   tl_i.a_size,\n     source: tl_i.a_source\n@@ -202,7 +206,7 @@ module tlul_adapter_sram #(\n \n   assign rspfifo_wvalid = rvalid_i & reqfifo_rvalid;\n   assign rspfifo_wdata  = '{\n-    data:  rdata_i,\n+    data:  rdata_i & rmask, // make sure only requested bytes are forwarded\n     error: rerror_i[1]  // Only care for Uncorrectable error\n   };\n   assign rspfifo_rready = (reqfifo_rdata.op == OpRead & ~reqfifo_rdata.error)"}, {"repo": "opentitan", "hash": "b1b24f98e3d4c401cf6743d1002122cdb96d42b5", "subject": "[dv,jtag] Teach jtag_dmi_reg_frontdoor to handle resets", "body": "This ensures that a DMI operation that is in flight will be\naborted (rather than hanging) if a reset gets asserted.\n\nSigned-off-by: Rupert Swarbrick <rswarbrick@lowrisc.org>", "files": "M hw/dv/sv/jtag_dmi_agent/jtag_dmi_reg_frontdoor.sv", "diff": "diff --git a/hw/dv/sv/jtag_dmi_agent/jtag_dmi_reg_frontdoor.sv b/hw/dv/sv/jtag_dmi_agent/jtag_dmi_reg_frontdoor.sv\nindex 83802fd566..ce7316422a 100644\n--- a/hw/dv/sv/jtag_dmi_agent/jtag_dmi_reg_frontdoor.sv\n+++ b/hw/dv/sv/jtag_dmi_agent/jtag_dmi_reg_frontdoor.sv\n@@ -22,9 +22,8 @@ class jtag_dmi_reg_frontdoor extends uvm_reg_frontdoor;\n \n   virtual task body();\n     csr_field_t         csr_or_fld;\n-    uvm_reg_data_t      wdata = 0, rdata;\n+    uvm_reg_data_t      wdata = 0;\n     jtag_dtm_reg_block  jtag_dtm_ral = jtag_agent_cfg_h.jtag_dtm_ral;\n-    jtag_dmi_op_rsp_e   op_rsp;\n \n     // Configure the JTAG agent to have a positive run-to-clear length, ensuring that DMI operations\n     // make it from dmi_jtag to dm_top and back again before TCK stops.\n@@ -75,41 +74,102 @@ class jtag_dmi_reg_frontdoor extends uvm_reg_frontdoor;\n     // Start the DMI request.\n     csr_wr(.ptr(jtag_dtm_ral.dmi), .value(wdata), .blocking(1), .predict(1));\n \n+    if (jtag_agent_cfg_h.in_reset) begin\n+      `uvm_info(`gfn, \"DMI operation aborted: reset happened in middle of request\", UVM_HIGH)\n+      jtag_dtm_ral_sem_h.put();\n+      return;\n+    end\n+\n     // Wait 10 tck cycles to allow the DMI req to complete. If we read the DTM DMI register too\n-    // soon, it may end up setting the in progress sticky bit, causing more time wasted.\n-    jtag_agent_cfg_h.vif.wait_tck(10);\n-\n-    // Poll for completion. Reset DMI if the sticky bit 'InProgress' is set.\n-    `DV_SPINWAIT_EXIT(\n-      do begin\n-        csr_rd(.ptr(jtag_dtm_ral.dmi), .value(rdata), .blocking(1));\n-        op_rsp = jtag_dmi_op_rsp_e'(get_field_val(jtag_dtm_ral.dmi.op, rdata));\n-        `uvm_info(`gfn, $sformatf(\"DMI CSR req status: %0s\", op_rsp.name()), UVM_HIGH)\n-        if (op_rsp == DmiOpInProgress) begin\n-          csr_wr(.ptr(jtag_dtm_ral.dtmcs.dmireset), .value(1), .blocking(1), .predict(1));\n-        end else begin\n-          rw_info.status = op_rsp == DmiOpOk ? UVM_IS_OK : UVM_NOT_OK;\n-          if (rw_info.kind == UVM_READ) begin\n-            rdata = get_field_val(jtag_dtm_ral.dmi.data, rdata);\n-            if (csr_or_fld.field != null) begin\n-              rdata = get_field_val(csr_or_fld.field, rdata);\n-            end\n-            rw_info.value = new[1];\n-            rw_info.value[0] = rdata;\n-          end\n+    // soon, it may end up setting the in progress sticky bit, causing more time wasted. If there is\n+    // a reset in the middle of the wait, stop immediately.\n+    fork begin\n+      fork\n+        jtag_agent_cfg_h.vif.wait_tck(10);\n+        wait(jtag_agent_cfg_h.in_reset);\n+      join_any\n+      disable fork;\n+    end join\n+    if (jtag_agent_cfg_h.in_reset) begin\n+      `uvm_info(`gfn, \"DMI operation aborted: reset happened in middle of request\", UVM_HIGH)\n+      jtag_dtm_ral_sem_h.put();\n+      return;\n+    end\n+\n+    // Do repeated reads of the DMI register to poll for completion, stopping early if we see a\n+    // reset. Run this in parallel with a 10k TCK cycle wait so that we'll fail reasonably quickly\n+    // if something gets completely stuck.\n+    fork begin : isolation_fork\n+      bit saw_completion = 1'b0;\n+\n+      fork\n+        begin\n+          poll_for_completion(jtag_dtm_ral, csr_or_fld.field);\n+          saw_completion = 1'b1;\n         end\n-      end while (op_rsp == DmiOpInProgress);,\n-      begin\n-        fork\n-          wait(jtag_agent_cfg_h.in_reset);\n-          // TODO: Make timeout more configurable.\n-          `DV_WAIT_TIMEOUT(jtag_agent_cfg_h.vif.tck_period_ps * 10_000_000 /*10 ms*/)\n-        join_any\n-      end\n-    )\n+        jtag_agent_cfg_h.vif.wait_tck(10_000);\n+      join_any\n+\n+      // The DMI operation should have completed in the time we were waiting\n+      `DV_CHECK(saw_completion)\n+\n+      disable fork;\n+    end join\n \n     `uvm_info(`gfn, $sformatf(\"DMI CSR req completed: %0s\", rw_info.convert2string()), UVM_HIGH)\n     jtag_dtm_ral_sem_h.put();\n   endtask\n \n+  // Poll the DMI register over JTAG and wait until the operation is no longer in progress.\n+  //\n+  // When the operation completes, details are written to rw_info. If this is a read of a field\n+  // (rather than an entire register), that should be passed as the field argument and this is used\n+  // when constructing rdata.\n+  //\n+  // If there is a reset while we are waiting for completion, stop and set rw_info.status to\n+  // UVM_NOT_OK.\n+  task poll_for_completion(jtag_dtm_reg_block jtag_dtm_ral, uvm_reg_field field);\n+    forever begin\n+      uvm_reg_data_t    rdata;\n+      jtag_dmi_op_rsp_e op_rsp;\n+\n+      // Try to read the DMI register over JTAG\n+      csr_rd(.ptr(jtag_dtm_ral.dmi), .value(rdata), .blocking(1));\n+\n+      // If there was a JTAG reset in the meantime, set rw_info.status to UVM_NOT_OK and return.\n+      if (jtag_agent_cfg_h.in_reset) begin\n+        rw_info.status = UVM_NOT_OK;\n+        return;\n+      end\n+\n+      op_rsp = jtag_dmi_op_rsp_e'(get_field_val(jtag_dtm_ral.dmi.op, rdata));\n+      `uvm_info(`gfn, $sformatf(\"DMI CSR req status: %0s\", op_rsp.name()), UVM_HIGH)\n+\n\u2026 (28 more diff lines in this file not shown)"}, {"repo": "caliptra-rtl", "hash": "ce475e3f28d0bbfaa7b3eda7dc232088b7ecea82", "subject": "Merged PR 114881: UVM mailbox sequence fix for invalid PAUSER access check", "body": "Change register check approach to avoid an edge case where new dlen/cmd = old dlen/cmd and flags false error\n\nRelated work items: #511911", "files": "M src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/verification_ip/environment_packages/soc_ifc_env_pkg/sequences/mbox/soc_ifc/soc_ifc_env_mbox_sequence_base.svh", "diff": "diff --git a/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/verification_ip/environment_packages/soc_ifc_env_pkg/sequences/mbox/soc_ifc/soc_ifc_env_mbox_sequence_base.svh b/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/verification_ip/environment_packages/soc_ifc_env_pkg/sequences/mbox/soc_ifc/soc_ifc_env_mbox_sequence_base.svh\nindex cb51fe60..abed679a 100644\n--- a/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/verification_ip/environment_packages/soc_ifc_env_pkg/sequences/mbox/soc_ifc/soc_ifc_env_mbox_sequence_base.svh\n+++ b/src/soc_ifc/uvmf_soc_ifc/uvmf_template_output/verification_ip/environment_packages/soc_ifc_env_pkg/sequences/mbox/soc_ifc/soc_ifc_env_mbox_sequence_base.svh\n@@ -370,15 +370,16 @@ endtask\n //              mbox_cmd and mbox_dlen registers\n //==========================================\n task soc_ifc_env_mbox_sequence_base::mbox_set_cmd(input mbox_op_s op);\n-    uvm_reg_data_t data;\n+    uvm_reg_data_t data, prev_data;\n \n+    prev_data = reg_model.mbox_csr_rm.mbox_cmd.get_mirrored_value();\n     reg_model.mbox_csr_rm.mbox_cmd.write(reg_sts, uvm_reg_data_t'(op.cmd), UVM_FRONTDOOR, reg_model.soc_ifc_APB_map, this, .extension(get_rand_user(PAUSER_PROB_CMD)));\n     report_reg_sts(reg_sts, \"mbox_cmd\");\n     if (!pauser_used_is_valid()) begin\n         if (rand_delay_en) do_rand_delay(1, step_delay);\n         reg_model.mbox_csr_rm.mbox_cmd.read(reg_sts, data, UVM_FRONTDOOR, reg_model.soc_ifc_APB_map, this, .extension(get_rand_user(FORCE_VALID_PAUSER)));\n         report_reg_sts(reg_sts, \"mbox_cmd\");\n-        if (mbox_cmd_u'(data) == op.cmd)\n+ const KEY="veridelta_review_v1_"+DATA.map(d=>d.hash.slice(0,6)).join("").slice(0,60);
let ans={};try{ans=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let i=0;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(ans))}catch(e){}}
function render(){
 const d=DATA[i],a=ans[d.hash]||{};
 $("subj").textContent=d.subject;$("meta").textContent=d.repo+"  "+d.hash.slice(0,12)+"  ("+(i+1)+"/"+DATA.length+")";
 $("body").textContent=d.body||"(no message body)";$("files").textContent=d.files;
 const pre=$("diff");pre.textContent="";
 for(const ln of d.diff.split("\n")){const s=document.createElement("div");s.textContent=ln||" ";
  s.className=ln.startsWith("+")&&!ln.startsWith("+++")?"add":ln.startsWith("-")&&!ln.startsWith("---")?"del":ln.startsWith("@@")?"hunk":ln.startsWith("diff ")?"hdr":"";pre.appendChild(s)}
 pre.scrollTop=0;
 document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",a.label===b.dataset.l));
 document.querySelectorAll("[data-c]").forEach(b=>b.classList.toggle("on",a.conf===b.dataset.c));
 $("note").value=a.note||"";
 const n=Object.values(ans).filter(x=>x.label).length;
 $("prog").textContent=n+"/"+DATA.length+" labeled";$("state").innerHTML=a.label?'<span class="done">saved</span>':"";
}
function set(k,v){const d=DATA[i];ans[d.hash]=Object.assign(ans[d.hash]||{},{[k]:v});save();render()}
function go(n){i=Math.max(0,Math.min(DATA.length-1,i+n));render()}
function nextTodo(){for(let k=1;k<=DATA.length;k++){const j=(i+k)%DATA.length;if(!(ans[DATA[j].hash]||{}).label){i=j;render();return}}}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>set("label",b.dataset.l));
document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>set("conf",b.dataset.c));
$("note").oninput=e=>{const d=DATA[i];ans[d.hash]=Object.assign(ans[d.hash]||{},{note:e.target.value});save()};
document.addEventListener("keydown",e=>{if(e.target.tagName==="TEXTAREA")return;
 const m={d:"design",v:"verification",b:"both",n:"neither"};
 if(m[e.key])set("label",m[e.key]);else if("123".includes(e.key)&&e.key)set("conf",e.key);
 else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
function q(s){return '"'+String(s==null?"":s).replace(/"/g,'""')+'"'}
function exportCsv(){const rows=["repo,hash,human_label,human_confidence,note"];
 for(const d of DATA){const a=ans[d.hash]||{};rows.push([d.repo,d.hash,a.label||"",a.conf||"",a.note||""].map(q).join(","))}
 const blob=new Blob([rows.join("\n")],{type:"text/csv"});const l=document.createElement("a");
 l.href=URL.createObjectURL(blob);l.download="human_labels.csv";l.click()}
render();
</script></body></html>
